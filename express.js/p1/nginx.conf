# nginx.conf — اصلاح‌شده برای Windows, TLS termination, Nginx serves static, proxy to Node (127.0.0.1:3000)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # مسیر لاگ‌ها — از مسیر مطلق استفاده شده
    error_log  D:/nginx-1.28.0/logs/error.log warn;
    access_log D:/nginx-1.28.0/logs/access.log;

    # upstream به Node روی loopback (فقط IPv4)
    upstream backend {
        server 127.0.0.1:3000;
        # اگر می‌خواهی IPv6 هم پشتیبانی شود این خط را آن‌کامنت کن:
        # server [::1]:3000;
    }

    # تنظیمات TLS کلی توصیه‌شده
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # timeouts مرتبط با پروکسی و client
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
    send_timeout 60s;
    client_body_timeout 60s;

    # بلوک برای ریدایرکت HTTP -> HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # سرور اصلی HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate      D:/resume/resume/express.js/p1/cert.pem;
        ssl_certificate_key  D:/resume/resume/express.js/p1/key.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # هدرهای امنیتی
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ریشه و index
        root D:/resume/resume/express.js/p1/public;
        index index.html;

        # مسیر API به Node.js (proxied over HTTP to 127.0.0.1:3000)
        location ^~ /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # هدرهای proxy مهم برای Node جلوی Nginx
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 90s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
        }

        # فایل‌های استاتیک با کش بلندمدت
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|woff2|woff|ttf|svg|eot|map)$ {
            root D:/resume/resume/express.js/p1/public;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Served-By "nginx";
            try_files $uri $uri/ =404;
        }
        
        # صفحه اصلی و fallback برای SPA
        location ~ ^/(?!api/)[^\.]*$ {
            # چون ما از نسخه ی پایه استفاده می کنیم این قابلیت را ندارد
            # disable_symlinks if_not_owner from=$document_root;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.\.\/ {
            return 403;
        }

        # جلوگیری از دسترسی به فایل‌های مخفی
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
