<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
</head>

<body style="text-align: center;">
    <h1>create</h1>
    <input type="text" name="input" id="input">
    <button onclick="insert()">insert</button>
    <hr>
    <h1>update</h1>
    <label for="update">id:</label>
    <input type="number" name="update" id="uId">
    <br>
    <label for="uName">name:</label>
    <input type="text" name="update" id="uName">
    <button onclick="fUpdate()">update</button>
    <p id="output"></p>
</body>
<script>
    (async () => {
        const getData = await fetch('http://localhost:3000/todos');
        const jsonData = await getData.json();
        output.innerText = JSON.stringify(jsonData, null, 2);
    })();
    async function insert() {
        const input = document.getElementById('input').value;
        const output = document.getElementById('output');
        try {
            const postData = await fetch('http://localhost:3000/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: input })
            });
            const jsonData = await postData.json();
            output.innerText = JSON.stringify(jsonData, null, 2);
        } catch (error) {
            console.error('خطا در ارتباط با سرور:', error);
        }
    }
    async function fUpdate() {
        const id = document.getElementById('uId').value;
        const name = document.getElementById('uName').value;
        const output = document.getElementById('output');
        try {
            const postData = await fetch(`http://localhost:3000/todos/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: name })
            });
            const jsonData = await postData.json();
            output.innerText = JSON.stringify(jsonData, null, 2);
        } catch (error) {
            console.error('خطا در ارتباط با سرور:', error);
        }
    }
</script>

</html>
